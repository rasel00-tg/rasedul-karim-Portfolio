<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(192, 38, 211, 0.45)" stroke-width="1.2"/>
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(168, 85, 247, 0.65)" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1.8" fill="#F0ABFC" opacity="0.9"/>
      <circle cx="0" cy="0" r="3.5" fill="none" stroke="rgba(217, 70, 239, 0.4)" stroke-width="0.8"/>
    </pattern>
    <pattern id="subgrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(168, 85, 247, 0.18)" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="none"/>
