<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="none">
  <defs>
    <radialGradient id="cyanCore" cx="50%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#BAE6FD" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F0F9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topAura" cx="50%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#E0F2FE" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hourglassFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Base sky blue background -->
  <rect width="100%" height="100%" fill="#E8F7FD"/>
  <!-- Top luminous aura -->
  <ellipse cx="720" cy="120" rx="650" ry="320" fill="url(#topAura)"/>
  <!-- Central hourglass cyan burst -->
  <ellipse cx="720" cy="680" rx="720" ry="420" fill="url(#cyanCore)"/>
  <path d="M 0 0 Q 720 400 1440 0 L 1440 900 Q 720 500 0 900 Z" fill="url(#hourglassFlow)" opacity="0.3"/>
</svg>
